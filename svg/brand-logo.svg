<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="50%" stop-color="#DFB76C"/>
      <stop offset="100%" stop-color="#9C722B"/>
    </linearGradient>
    <!-- Subtle Inner Dark Glow -->
    <radialGradient id="cylinderCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1E1C"/>
      <stop offset="100%" stop-color="#0E0E0D"/>
    </radialGradient>
  </defs>

  <!-- Outer Dark Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#cylinderCore)" stroke="url(#goldGrad)" stroke-width="1.75"/>

  <!-- Precision Calibrated Concentric Ring (Rotogravure Cylinder Rim) -->
  <circle cx="32" cy="32" r="24" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Minimalist Geometric Apex / Diamond Engraving Monogram -->
  <path d="M32 14L46 38H18L32 14Z" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Central Precision Engraving Cell / Diamond Core -->
  <path d="M32 23L39 35H25L32 23Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Horizontal Cylinder Axis Calibrations -->
  <line x1="10" y1="32" x2="15" y2="32" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="32" x2="54" y2="32" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="32" y2="13" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="54" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
